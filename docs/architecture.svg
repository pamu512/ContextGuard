<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="ContextGuard architecture">
  <rect width="960" height="420" fill="#F7F4EF"/>
  <text x="32" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700">ContextGuard</text>
  <text x="32" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#57534E">read ’ reason ’ act on DataHub context</text>

  <rect x="40" y="110" width="140" height="70" rx="8" fill="#0F6E56"/>
  <text x="110" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">Streamlit UI</text>

  <rect x="230" y="110" width="160" height="70" rx="8" fill="#292524"/>
  <text x="310" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">Orchestrator</text>
  <text x="310" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#D6D3D1">parse · score · generate</text>

  <rect x="440" y="60" width="170" height="70" rx="8" fill="#1D4E89"/>
  <text x="525" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">DataHub MCP</text>
  <text x="525" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#DBEAFE">schema · lineage · owners</text>

  <rect x="440" y="160" width="170" height="70" rx="8" fill="#7C2D12"/>
  <text x="525" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">Gemini (optional)</text>
  <text x="525" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FED7AA">grounded artifacts</text>

  <rect x="670" y="110" width="170" height="70" rx="8" fill="#365314"/>
  <text x="755" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">Artifacts ZIP</text>
  <text x="755" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ECFCCB">SQL · tests · checklist</text>

  <rect x="440" y="280" width="240" height="70" rx="8" fill="#44403C"/>
  <text x="560" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff">Write-back (opt-in)</text>
  <text x="560" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#D6D3D1">save_document + review tag</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57534E"/>
    </marker>
  </defs>
  <line x1="180" y1="145" x2="230" y2="145" stroke="#57534E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="440" y2="95" stroke="#57534E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="160" x2="440" y2="195" stroke="#57534E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="145" x2="670" y2="145" stroke="#57534E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="180" x2="310" y2="315" stroke="#57534E" stroke-width="2"/>
  <line x1="310" y1="315" x2="440" y2="315" stroke="#57534E" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
